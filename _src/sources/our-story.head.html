<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Story &middot; Kodama</title>
<meta name="description" content="Kodama began with Uncle Mike. He built a fortune trading, lost it, and spent the years afterwards building the system that would not have let it happen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060D0A; --bg2:#0A1611; --card:#0E1C16; --card2:#122318;
  --line:#1E3329; --line2:#2A4636;
  --ink:#EAF2ED; --ink2:#A8BDB1; --ink3:#6F877A;
  --green:#4FB286; --amber:#E0A33E; --green2:#3A8C69; --deep:#173A2B;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-weight:300; line-height:1.6; -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 900px 600px at 50% -10%, rgba(79,178,134,.13), transparent 70%);
  background-repeat:no-repeat;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

header{text-align:center;padding:60px 0 8px}
header a.home{text-decoration:none;display:inline-block;transition:opacity .3s ease}
header a.home:hover{opacity:.78}
.markimg{width:103px;height:auto;display:block;margin:0 auto 10px}
.mark{font-family:var(--serif);font-size:44px;letter-spacing:.02em;color:#fff;line-height:1}
.sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--green);margin-top:10px}
h1{font-family:var(--serif);font-size:clamp(32px,5vw,54px);font-weight:400;margin:40px 0 16px;line-height:1.15}
.lede{font-size:17px;color:var(--ink2);max-width:660px;margin:0 auto;font-weight:300}
.nowrap{white-space:nowrap}
.tagline{font-family:var(--serif);font-style:italic;color:var(--ink3);font-size:16px;margin-top:18px}

.toggle{display:flex;align-items:center;justify-content:center;gap:12px;margin:44px 0 6px;flex-wrap:wrap}
.tbtn{background:none;border:1px solid var(--line2);color:var(--ink2);font-family:var(--sans);
  font-size:14px;padding:9px 22px;border-radius:100px;cursor:pointer;transition:.18s}
.tbtn[aria-pressed="true"]{background:var(--deep);border-color:var(--green2);color:#fff}
.tbtn:hover{border-color:var(--green2)}
.savebadge{background:rgba(79,178,134,.1);border:1px solid var(--green2);color:var(--green);
  font-size:12px;padding:6px 13px;border-radius:100px}
.tognote{text-align:center;font-size:12.5px;color:var(--amber);margin-top:14px}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:34px 0 0;align-items:stretch}
@media(max-width:940px){.grid{grid-template-columns:1fr;max-width:470px;margin-inline:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px 26px;
  position:relative;display:flex;flex-direction:column}
.card.feat{background:linear-gradient(170deg,var(--card2),var(--card));border-color:var(--green2);
  box-shadow:0 0 0 1px rgba(79,178,134,.18),0 20px 50px -20px rgba(0,0,0,.7)}
.flag{position:absolute;top:-11px;left:26px;background:var(--green2);color:#04120C;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:4px 12px;border-radius:100px}
.tname{font-family:var(--serif);font-size:29px;color:#fff;line-height:1}
.tmean{font-family:var(--serif);font-style:italic;font-size:14px;color:var(--ink2);margin-top:11px;line-height:1.5}
.trole{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--green);margin-top:13px}
.tdesc{color:var(--ink2);font-size:14px;margin-top:15px;min-height:88px}
.price{margin:22px 0 4px;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.pnum{font-family:var(--serif);font-size:42px;color:#fff;line-height:1}
.pper{color:var(--ink3);font-size:14px}
.pnote{font-size:12px;color:var(--ink);min-height:34px}
.cta{display:block;width:100%;text-align:center;margin:20px 0 22px;padding:13px;
  border-radius:8px;font-size:14px;font-weight:500;letter-spacing:.03em;font-family:var(--sans);
  border:1px solid var(--line2);color:var(--ink);background:none;transition:.18s}
.cta.solid{background:var(--green2);border-color:var(--green2);color:#04120C;font-weight:600}
.cta[disabled]{opacity:.55;cursor:not-allowed}
ul{list-style:none;font-size:14px}
li{display:flex;gap:11px;padding:7px 0;align-items:flex-start;color:var(--ink2)}
li .i{flex:0 0 15px;margin-top:3px;color:var(--green)}
li.no{color:var(--ink3)}
li.no .i{color:var(--ink3)}
li.no span:last-child{text-decoration:line-through;text-decoration-color:var(--line2)}
li b{color:var(--ink);font-weight:500}
.divider{border-top:1px solid var(--line);margin:16px 0 10px;padding-top:12px;
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3)}
.disclose{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink3);line-height:1.65}

.strip{border:1px solid var(--line);border-radius:12px;padding:22px 26px;margin-top:20px;
  background:rgba(14,28,22,.5)}
.strip.lead{border-color:var(--green2);background:linear-gradient(100deg,rgba(23,58,43,.5),rgba(14,28,22,.4))}
.strip p{font-size:14px;color:var(--ink2)}
.strip p+p{margin-top:11px}
.strip b{color:var(--ink);font-weight:500}

section{margin-top:76px}
h2{font-family:var(--serif);font-size:31px;font-weight:400;margin-bottom:10px}
.h2sub{color:var(--ink2);font-size:15px;margin-bottom:26px;max-width:680px}

.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
th,td{text-align:left;padding:13px 14px;border-bottom:1px solid var(--line)}
th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:500}
td:first-child{color:#fff;font-weight:400}
td{color:var(--ink2)}
td.hl{color:var(--green)}
.tnote{font-size:13px;color:var(--ink3);margin-top:16px}

details{border-bottom:1px solid var(--line)}
summary{padding:18px 34px 18px 0;cursor:pointer;list-style:none;position:relative;
  font-size:15px;color:var(--ink);font-weight:400}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';position:absolute;right:6px;top:16px;font-size:20px;color:var(--green);font-weight:300}
details[open] summary::after{content:'\2212'}
details p{padding:0 0 18px;color:var(--ink2);font-size:14px;max-width:780px}
details p+p{padding-top:0;margin-top:-6px}

footer{margin-top:80px;border-top:1px solid var(--line);padding:34px 0 60px;
  font-size:12px;color:var(--ink3);line-height:1.75}
footer b{color:var(--ink2);font-weight:500}
footer p+p{margin-top:13px}
footer a{color:var(--ink3);text-decoration:none;transition:color .3s ease}
footer a:hover{color:var(--green)}
/* Align the CTA row across all three cards at desktop width. Each block above
   the button gets a matched minimum so the buttons start on the same line.
   Applied only where the cards sit side by side. */
@media(min-width:941px){
  .tmean{min-height:42px}
  .trole{min-height:34px}
  .tdesc{min-height:112px}
  .pnote{min-height:34px}
  .price{min-height:46px}
}

/* ─── Founders page ─── */
.lede-2{font-size:17px;color:var(--ink2);max-width:680px;margin:18px auto 0;font-weight:300}
.mem{display:grid;grid-template-columns:340px 1fr;gap:44px;align-items:start;margin-top:56px}
@media(max-width:860px){.mem{grid-template-columns:1fr;gap:30px}}
.portrait{width:100%;border-radius:14px;border:1px solid var(--line);display:block;background:var(--card)}
.pcap{font-size:12px;color:var(--ink3);margin-top:12px;line-height:1.6}
.mname{font-family:var(--serif);font-size:34px;color:#fff;line-height:1.15}
.mdates{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--green);margin-top:12px}
.mem p{color:var(--ink2);font-size:15.5px;line-height:1.8;margin-top:18px}
.mem p b{color:var(--ink);font-weight:500}
.pull{border-left:2px solid var(--green2);padding:6px 0 6px 22px;margin:32px 0;
  font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.55;color:var(--ink)}
.pull span{display:block;font-family:var(--sans);font-style:normal;font-size:12px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:14px}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:30px}
@media(max-width:860px){.people{grid-template-columns:1fr;max-width:460px;margin-inline:auto}}
.person{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
.person h3{font-family:var(--serif);font-weight:400;font-size:23px;color:#fff;line-height:1.1}
.person .role{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-top:11px}
.person p{font-size:14px;color:var(--ink2);margin-top:15px;line-height:1.7}
.memlink{margin-top:22px}
.memlink a{display:inline-block;padding:12px 26px;border:1px solid var(--line2);border-radius:100px;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink);text-decoration:none;
  transition:.2s}
.memlink a:hover{border-color:var(--green2);color:var(--green)}

/* ---- slide copy layout, added 2026-09-06 ---- */
header h1{font-style:italic}
.slide{max-width:900px;margin:10px auto 0;padding:0 4px 40px}
.slide p{font-size:17px;line-height:1.75;color:var(--ink2);margin:0 0 22px;font-weight:300}
.slide .lead{font-size:19px;color:var(--ink);font-weight:600;margin-bottom:26px}
.slide .signals{font-style:italic;color:var(--green)}
.slide .passed{font-weight:700;font-style:italic;color:var(--ink);font-size:19px}
.slide .carry{font-style:italic;color:var(--ink3);font-size:16px;margin-top:34px}
.slide .rule{height:1px;background:var(--line2);margin:30px 0 26px}
.slide .kicker{text-align:center;font-style:italic;color:var(--amber);font-size:18px;margin:0}
@media(max-width:640px){.slide p{font-size:16px}}

.slide .memlink{margin-top:28px;text-align:center}

.slide .carry .passedline{color:var(--ink);font-weight:700;font-style:italic}

/* ---- social, added 2026-09-06 ---- */
.social{display:flex;justify-content:center;gap:20px;margin:0 0 26px}
.social a{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;
  border:1px solid var(--line);border-radius:50%;color:var(--ink3);transition:.2s}
.social a:hover{border-color:var(--green2);color:var(--green)}
.social svg{width:18px;height:18px;fill:currentColor;display:block}
</style>
</head>
